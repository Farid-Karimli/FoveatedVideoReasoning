# Step 1 smoke test (CLAUDE.md "Experiment order").
# One dataset, 50 items, full high-res vs full downsampled vs predicted-gaze crop,
# at two matched token budgets. Centre crop is an extra control: EgoGazeLite has a
# built-in centre bias, so we need to know if "gaze" is just "centre".
name: smoke_cc4d_step_mcq
seed: 0
out_root: /projectnb/proactiveai/results/foveated

model:
  id: Qwen/Qwen2.5-VL-7B-Instruct

dataset:
  name: captaincook4d
  root: /projectnb/proactiveai/data/captaincook4d
  video_dir: gopro/360p
  n_items: 50
  n_options: 5
  min_duration_s: 4.0

sampling:
  fps: 1.0
  max_frames: 32

# Token grids (rows, cols) of 28x28-pixel cells. One token = 2 frames x 28 x 28 px.
# Full: 360x640 video -> 364x644 = 13x23 = 299 tokens per frame pair.
full_grid: [13, 23]
budgets:
  b10: [4, 7]    # 28 tokens  = 9.4% of full
  b28: [7, 12]   # 84 tokens  = 28.1% of full

gaze:
  checkpoint: egogazelite_option_a.pt

conditions:
  - {name: full_hires, view: full}
  - {name: down_b10, view: downsample, budget: b10}
  - {name: down_b28, view: downsample, budget: b28}
  - {name: gazepred_b10, view: crop, signal: gaze_predicted, budget: b10}
  - {name: gazepred_b28, view: crop, signal: gaze_predicted, budget: b28}
  - {name: centre_b10, view: crop, signal: centre, budget: b10}
  - {name: centre_b28, view: crop, signal: centre, budget: b28}
