[project]
name = "foveated-video-reasoning"
version = "0.1.0"
description = "Measurement study: when does foveated video input help a frozen video-language model?"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers==4.51.3",
    "accelerate>=1.5",
    "timm>=1.0",
    "opencv-python-headless>=4.9",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26,<2.3",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "huggingface-hub>=0.30",
    "pillow>=10.0",
    "scipy>=1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fovea", "src/eval", "third_party/egogazelite"]
